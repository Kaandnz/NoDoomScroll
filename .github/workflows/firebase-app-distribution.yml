name: Build and Distribute to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE_DISTRIBUTION: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_CREDENTIALS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Restore debug keystore
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName=0.1.${{ github.run_number }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodoomscroll-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to Firebase App Distribution
        if: env.HAS_FIREBASE_DISTRIBUTION == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          testers: ${{ secrets.FIREBASE_TESTER_EMAIL }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }}: ${{ github.event.head_commit.message || 'Manual dispatch' }}"
